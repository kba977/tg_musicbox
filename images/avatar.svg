<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A6B"/>
      <stop offset="0.55" stop-color="#F0508C"/>
      <stop offset="1" stop-color="#7B4DFF"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3E9FF"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B2FD6"/>
      <stop offset="1" stop-color="#8E5CFF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3A0F6B" flood-opacity="0.28"/>
    </filter>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="320" cy="300" r="250" fill="url(#glow)"/>

  <!-- 盖子：竖立在盒子后面 -->
  <rect x="176" y="196" width="288" height="150" rx="28" fill="#FFFFFF" opacity="0.22"/>
  <rect x="176" y="196" width="288" height="150" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="6"/>

  <!-- 盒口 -->
  <rect x="166" y="318" width="308" height="44" rx="16" fill="url(#inner)" filter="url(#shadow)"/>

  <!-- 音符：从盒口冒出来 -->
  <g filter="url(#shadow)" fill="#FFFFFF">
    <path d="M294 124 L410 96 L410 136 L294 164 Z"/>
    <rect x="294" y="124" width="18" height="190" rx="6"/>
    <rect x="392" y="96" width="18" height="196" rx="6"/>
    <ellipse cx="272" cy="316" rx="38" ry="28" transform="rotate(-22 272 316)"/>
    <ellipse cx="370" cy="294" rx="38" ry="28" transform="rotate(-22 370 294)"/>
  </g>

  <!-- 闪光 -->
  <g fill="#FFFFFF">
    <path d="M206 120 l8 20 l20 8 l-20 8 l-8 20 l-8 -20 l-20 -8 l20 -8 z"/>
    <path d="M470 150 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 z"/>
    <circle cx="452" cy="82" r="7" opacity="0.85"/>
  </g>

  <!-- 盒身 -->
  <g filter="url(#shadow)">
    <rect x="160" y="340" width="320" height="150" rx="30" fill="url(#box)"/>
    <rect x="160" y="384" width="320" height="16" fill="#F0508C" opacity="0.85"/>
    <!-- 发条把手 -->
    <rect x="478" y="410" width="34" height="12" rx="6" fill="#FFFFFF"/>
    <rect x="504" y="388" width="14" height="56" rx="7" fill="#FFFFFF"/>
  </g>
</svg>
