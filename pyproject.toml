[project]
name = "tg-musicbox"
version = "2.0.0"
description = "在 Telegram 上搜索并下载网易云音乐"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot[rate-limiter]>=22.8,<23",
    "httpx[socks]>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: 访问真实网易云接口的测试（设置 NETEASE_LIVE=1 才运行）"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
